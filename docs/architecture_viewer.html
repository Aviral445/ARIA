<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <style>
    :root {
      --bg-canvas: #060913;
      --bg-panel: rgba(13, 19, 38, 0.95);
      --border-subtle: rgba(255, 255, 255, 0.12);
      --cyan: #00f0ff;
      --purple: #c084fc;
      --emerald: #10b981;
      --rose: #f43f5e;
      --amber: #fbbf24;
      --sky: #38bdf8;
      --indigo: #818cf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-canvas);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* Header Bar */
    header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      z-index: 100;
      background: rgba(8, 12, 26, 0.96);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      gap: 1rem;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .badge-blueprint {
      background: linear-gradient(135deg, #0284c7, #6366f1);
      color: #fff;
      font-weight: 800;
      font-size: 0.72rem;
      padding: 0.25rem 0.55rem;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.05em;
    }

    .header-left h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .header-left p {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    /* Diagram Selector Tabs */
    .tab-bar {
      display: flex;
      background: rgba(0, 0, 0, 0.5);
      padding: 0.25rem;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
      gap: 0.25rem;
    }

    .tab-btn {
      padding: 0.4rem 0.85rem;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-family: 'Outfit', sans-serif;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .tab-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
    }

    .tab-btn.active {
      background: rgba(0, 240, 255, 0.16);
      color: var(--cyan);
      border: 1px solid rgba(0, 240, 255, 0.4);
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.25);
    }

    /* Pan & Zoom Controls */
    .controls {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .ctrl-btn {
      width: 34px;
      height: 34px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .ctrl-btn:hover {
      border-color: var(--cyan);
      color: var(--cyan);
      background: rgba(0, 240, 255, 0.15);
    }

    /* Canvas Viewport */
    main {
      width: 100vw;
      height: 100vh;
      padding-top: 60px;
      position: relative;
      overflow: hidden;
      cursor: grab;
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(0, 240, 255, 0.02) 0%, transparent 70%),
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 100% 100%, 35px 35px, 35px 35px;
    }

    main:active {
      cursor: grabbing;
    }

    .viewport-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform-origin: 0 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.05s linear;
    }

    /* Diagram Panels */
    .diagram-view {
      display: none;
      padding: 1rem;
    }

    .diagram-view.active {
      display: block;
    }

    /* HUD overlay */
    .hud {
      position: absolute;
      bottom: 1.25rem;
      left: 1.25rem;
      background: rgba(10, 15, 30, 0.9);
      border: 1px solid var(--border-subtle);
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      color: var(--cyan);
      pointer-events: none;
      z-index: 50;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    }

    /* SVG Diagram Styles */
    svg {
      overflow: visible;
      user-select: none;
    }

    .svg-box {
      fill: #0d1527;
      stroke: #1e293b;
      stroke-width: 1.5;
      rx: 8;
      ry: 8;
      filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.6));
      transition: all 0.2s;
    }

    .svg-box:hover {
      stroke-width: 2.5;
      filter: drop-shadow(0 8px 24px rgba(0, 240, 255, 0.25));
    }

    .panel-bg {
      fill: rgba(15, 23, 42, 0.65);
      stroke: rgba(255, 255, 255, 0.1);
      stroke-width: 1.5;
      stroke-dasharray: 6, 6;
      rx: 14;
      ry: 14;
    }

    .text-title {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      fill: #ffffff;
      font-size: 14px;
    }

    .text-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      fill: #94a3b8;
    }

    .text-panel-title {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 17px;
      letter-spacing: 0.02em;
    }

    .arrow-line {
      stroke-width: 2;
      fill: none;
    }

    .arrow-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      paint-order: stroke;
      stroke: #060913;
      stroke-width: 3px;
      stroke-linecap: butt;
      stroke-linejoin: miter;
    }
  </style>
</head>

  <!-- HUD overlay -->
  <div class="hud" id="hud">ZOOM: 100% | PAN: (0, 0) | DRAG TO PAN | MOUSE WHEEL TO ZOOM</div>

  <!-- Interactive Pan & Zoom Script -->
  <script>
    let scale = 1.0;
    let translateX = 0;
    let translateY = 0;
    let isDragging = false;
    let startX = 0;
    let startY = 0;

    const canvasWrapper = document.getElementById('canvasWrapper');
    const viewportContainer = document.getElementById('viewportContainer');
    const hud = document.getElementById('hud');

    function updateTransform() {
      canvasWrapper.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
      hud.textContent = `ZOOM: ${Math.round(scale * 100)}% | PAN: (${Math.round(translateX)}, ${Math.round(translateY)}) | DRAG TO PAN | WHEEL TO ZOOM`;
    }

    function zoom(delta) {
      scale = Math.max(0.2, Math.min(3.0, scale + delta));
      updateTransform();
    }

    function fitDiagramToScreen() {
      const activeSvg = document.querySelector('.diagram-view.active svg');
      if (!activeSvg) return;

      const svgWidth = parseFloat(activeSvg.getAttribute('width')) || 1600;
      const svgHeight = parseFloat(activeSvg.getAttribute('height')) || 1200;
      const availWidth = window.innerWidth - 60;
      const availHeight = window.innerHeight - 80;

      scale = Math.min(availWidth / svgWidth, availHeight / svgHeight, 1.0);
      translateX = Math.max(20, (window.innerWidth - svgWidth * scale) / 2);
      translateY = 70;
      updateTransform();
    }

    viewportContainer.addEventListener('mousedown', (e) => {
      if (e.target.closest('header')) return;
      isDragging = true;
      startX = e.clientX - translateX;
      startY = e.clientY - translateY;
    });

    window.addEventListener('mouseup', () => {
      isDragging = false;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      translateX = e.clientX - startX;
      translateY = e.clientY - startY;
      updateTransform();
    });

    viewportContainer.addEventListener('wheel', (e) => {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 0.08 : -0.08;
      scale = Math.max(0.2, Math.min(3.0, scale + factor));
      updateTransform();
    }, { passive: false });

    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.diagram-view').forEach(v => v.classList.remove('active'));

      const btn = Array.from(document.querySelectorAll('.tab-btn')).find(b => b.getAttribute('onclick').includes(tabId));
      if (btn) btn.classList.add('active');

      const view = document.getElementById(`view-${tabId}`);
      if (view) view.classList.add('active');

      fitDiagramToScreen();
    }

    window.addEventListener('resize', fitDiagramToScreen);

    // Initial fit
    setTimeout(fitDiagramToScreen, 50);
  </script>
